# Example values for a local `helm template`/`helm install` of the control
# plane. `kubenest platform install --control-plane` generates these itself
# (random jwtSecret, encryptionKey, admin and database passwords) and hands
# them to the chart as-is.
domain: "203.0.113.10.sslip.io"

jwtSecret: "replace-with-openssl-rand-hex-32"
# The agent key is a SECOND, independent random value (kn-t47). The chart
# refuses to render without it: it is what the hub verifies agent tokens with.
agentJwtSecret: "replace-with-another-openssl-rand-hex-32"
encryptionKey: "replace-with-a-fernet-key"

# The control plane's own CA, generated by the CLI at install. The chart
# refuses to render without it, and it is part of the recovery set.
gatewayCA:
  certificate: "-----BEGIN CERTIFICATE-----\nreplace-with-the-control-plane-ca\n-----END CERTIFICATE-----"
  privateKey: "-----BEGIN EC PRIVATE KEY-----\nreplace-with-the-control-plane-ca-key\n-----END EC PRIVATE KEY-----"
postgresql:
  auth:
    password: "replace-with-a-random-password"

backend:
  admin:
    email: "admin@example.com"
    password: "replace-with-a-random-password"

# The control-plane checkpoint CronJob (kn-t47): the only supported recovery
# path for the control plane's own database. The recipient is the FLEET public
# key (it can only encrypt); the tools image is pinned by digest like every
# other image here.
checkpoint:
  recipient: "age1replacewiththefleetrecipientpublickey"
  bucket: "replace-with-the-control-plane-checkpoint-bucket"
  tools:
    image:
      digest: "sha256:replace-with-the-checklist-tools-image-digest"
