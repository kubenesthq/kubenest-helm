# Example values for a local `helm template`/`helm install` of the control
# plane. `kubenest platform install --control-plane` generates these itself
# (random jwtSecret, encryptionKey, admin and database passwords) and hands
# them to the chart as-is.
domain: "203.0.113.10.sslip.io"

jwtSecret: "replace-with-openssl-rand-hex-32"
encryptionKey: "replace-with-a-fernet-key"
postgresql:
  auth:
    password: "replace-with-a-random-password"

backend:
  admin:
    email: "admin@example.com"
    password: "replace-with-a-random-password"
