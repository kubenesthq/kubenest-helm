# -- Domain for ingress resources (e.g. kubenest.example.com)
domain: "kubenest.example.com"

# -- Image pull secrets for private registries (e.g. ghcr.io)
# Create with: kubectl create secret docker-registry ghcr-creds -n kubenest-system --docker-server=ghcr.io --docker-username=<user> --docker-password=<pat>
imagePullSecrets: []
# - name: ghcr-creds

# -- Shared JWT secret for backend <-> hub <-> operator auth
# Generate with: openssl rand -hex 32
jwtSecret: ""

# -- Fernet key for encrypting cloud credentials at rest
# Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
encryptionKey: ""

# -- Shared secret for provisioning job callbacks (K8s Job -> backend)
# Generate with: openssl rand -hex 32
provisioningCallbackSecret: ""

# -- Namespace for kubenest (usually set via helm install -n)
# namespace: kubenest-system

# --- Backend (FastAPI) ---
backend:
  image:
    repository: ghcr.io/kubenesthq/kubenest-backend
    # PINNED, NOT FLOATING. This chart used to ship tag "latest" with
    # pullPolicy: Always, which meant the control-plane binary was re-resolved
    # on EVERY POD START: a node reboot silently changed the control plane on
    # an installation nobody touched, and no field in the chart could say which
    # build was running. See kn-control-plane-chart-floats-latest-tkof.
    #
    # tag is what a human reads; digest is what Kubernetes resolves, and digest
    # WINS (templates/_helpers.tpl "kubenest.image"). THEY MOVE TOGETHER — a tag
    # that disagrees with its digest is a comment that lies. Both were verified
    # against ghcr on 2026-09-11: :5dd7b9b and :latest resolved to the same
    # digest below.
    #
    # WHAT THIS BUILD IS, and this is the point of pinning rather than a nicety:
    # org.opencontainers.image.revision on this image is
    # 5dd7b9bfca4184f22e73b73e6f9351c76a3f5bc2, which CONTAINS ALL THREE
    # credential-boundary commits — b370dda (clear the stored bearer on the
    # ownership handover), a66c441 (clear on the ownership STATE rather than
    # only on the transition), 5dd7b9b (delete the orphaned ArgoCD cluster
    # Secret). So "is b370dda in the backend this install runs" is now a
    # question with an answer, and the answer is yes for this pin.
    tag: "5dd7b9b"
    digest: "sha256:25d9d31e7c8af8736040a0a52511a1895b28f30d6ecd76624d3ce616eef82416"
    # IfNotPresent, coherent with a digest. Always + a digest is merely
    # wasteful; Always + a mutable tag was the defect. This matches what the
    # provisioner does after kn-provisioner-untraceable-pin-m1b2.
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    # -- Override hostname (default: api.<domain>)
    host: ""
    annotations: {}
  # -- Initial admin user
  admin:
    email: "admin@kubenest.io"
    password: "changeme"

# --- Hub (Go WebSocket relay) ---
hub:
  image:
    repository: ghcr.io/kubenesthq/kubenest-hub
    # Same defect, same fix. :094b95e and :latest resolved to this digest on
    # 2026-09-11. Its org.opencontainers.image.revision is
    # 094b95e3b3ab347a54fd54309eea5144653d5f89 — the hub only recently learned
    # to stamp that (kn-xl9u); before it did, a hub image could be pinned but
    # not identified.
    tag: "094b95e"
    digest: "sha256:aa3deaeca21dda4542df1116b0bb873f05eaf4796b4d3a8583a2d0c4caf0fac8"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  ingress:
    enabled: true
    # -- Override hostname (default: hub.<domain>)
    host: ""
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.org/websocket-services: "{{ .Release.Name }}-hub"

# --- UI (Next.js) ---
ui:
  image:
    repository: ghcr.io/kubenesthq/kubenest-ui
    # Same defect, same fix. :5b72b22 and :latest resolved to this digest on
    # 2026-09-11.
    #
    # STATED LIMIT: this image carries NO org.opencontainers.image.revision, so
    # the digest pins it EXACTLY but nothing says which commit built it. A
    # digest without provenance is still strictly better than a mutable tag —
    # two installs of this chart now get the same bytes — but "which UI source
    # is this" remains unanswerable for this component. That is the kn-xl9u
    # shape, unfixed here; the UI build needs the same revision label the hub
    # just gained.
    tag: "5b72b22"
    digest: "sha256:2c0e0838dd0f8e8c43557c708f4cce27f927482334cf950d6795e912a3e11752"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  ingress:
    enabled: true
    # -- Override hostname (default: app.<domain>)
    host: ""
    annotations: {}

# --- Operator (optional subchart — disable if operator already installed separately) ---
operator:
  enabled: true

# -- Operator subchart values (passed to kubenest-operator-2 via alias)
operator-chart:
  image:
    repository: ghcr.io/kubenesthq/operatorv2
    tag: "latest"
    pullPolicy: Always
  serviceAccount:
    create: true
  rbac:
    create: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  bootstrap:
    argocd:
      enabled: true
    certManager:
      enabled: false
    ingressNginx:
      enabled: false
    gitea:
      enabled: true
    vault:
      enabled: false
  # Gitea subchart values (internal Git server for GitOps)
  gitea:
    gitea:
      admin:
        username: kubenest
        password: ""  # Set via --set operator-chart.gitea.gitea.admin.password=<value>
      config:
        database:
          DB_TYPE: sqlite3
        repository:
          DEFAULT_BRANCH: main
    # Disable Gitea's own PostgreSQL and Redis subcharts (use SQLite + built-in cache)
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    redis-cluster:
      enabled: false
    persistence:
      enabled: true
      size: 5Gi

# --- PostgreSQL (Bitnami) ---
postgresql:
  enabled: true
  auth:
    username: kubenest
    password: ""
    database: kubenest
  primary:
    persistence:
      size: 5Gi

# --- Redis (Bitnami) ---
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      size: 1Gi
