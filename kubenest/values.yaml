# KubeNest control-plane chart values.
#
# This chart installs the control plane of one KubeNest installation into a
# single cluster: the backend API, the operator relay (hub), the UI, PostgreSQL
# and Redis. It is installed by `kubenest platform install --control-plane` on
# the first cluster, and by `kubenest platform install` (with the pre-generated
# values below) on every further cluster that is registered to that control
# plane.

# -- Domain the three control-plane hostnames hang off: the UI at app.<domain>,
# the API at api.<domain> and the operator relay at hub.<domain>.
domain: "kubenest.example.com"

# -- Image pull secrets for private registries (e.g. ghcr.io)
# Create with: kubectl create secret docker-registry ghcr-creds -n kubenest-system --docker-server=ghcr.io --docker-username=<user> --docker-password=<pat>
imagePullSecrets: []
# - name: ghcr-creds

# -- REQUIRED. Key the backend signs USER SESSIONS with. It never leaves the
# backend: the hub does not hold it and never may. Generate with:
# openssl rand -hex 32
jwtSecret: ""

# -- REQUIRED. Key the hub verifies AGENT tokens with, and the key the backend
# signs them and its own `client_type: backend` token with (kn-t47). Separate
# from jwtSecret on purpose: the hub is rebuildable from the control-plane kit,
# the kit carries exactly one signing key, and a leaked session key must not be
# able to mint an agent token. Generate with: openssl rand -hex 32
agentJwtSecret: ""

# -- REQUIRED. Fernet key that encrypts stored secrets at rest. The chart
# refuses to render without it: the backend cannot even migrate a fresh
# database without it, and it will not derive it from jwtSecret.
# Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
encryptionKey: ""

# -- Shared secret for provisioning job callbacks (K8s Job -> backend)
# Generate with: openssl rand -hex 32
provisioningCallbackSecret: ""

# -- Set by `kubenest platform install --control-plane` to a hash of the chart
# archive and these values. It is stamped on the backend, hub and UI pod
# templates, so the installer can tell a Deployment running THIS apply from one
# still running the previous one. A changed value therefore rolls all three.
# Leave it empty when installing by hand.
installRevision: ""

# --- Gateway API exposure ---
# The platform bundle already runs Traefik with the Gateway API CRDs and a
# cert-manager ClusterIssuer that signs from the platform CA. This chart adds
# its OWN Gateway for the three control-plane hostnames, because the bundle's
# Gateway serves a single certificate for default.gateway.kubenest.internal and
# a client of api.<domain> would fail hostname verification against it.
gateway:
  # -- Render the Gateway, its Certificate and the HTTPRoutes.
  enabled: true
  # -- GatewayClass to attach to, served by the bundle's Traefik.
  className: "traefik"
  # -- Listener port. 8443 is the bundle Traefik's websecure ENTRYPOINT port,
  # not 443.
  port: 8443

# --- The control plane's own certificate authority (kn-t47) ---
# The control plane serves app./api./hub.<domain> from a certificate issued by
# its OWN CA, generated by the CLI at install and handed over here with its
# private key. It used to take its identity from the host cluster's CA
# (cert-manager/kubenest-ca), which every CLI and agent pins — so a control
# plane rebuilt on another cluster was rejected as an unknown authority and no
# restore could be trusted. The CA and its key travel in the control-plane kit,
# so the identity survives a restore or a move.
gatewayCA:
  # -- REQUIRED. PEM-encoded CA certificate (tls.crt).
  certificate: ""
  # -- REQUIRED. PEM-encoded CA private key (tls.key). It travels in the kit
  # and is never generated on a host.
  privateKey: ""

# --- Backend (FastAPI) ---
backend:
  image:
    repository: ghcr.io/kubenesthq/kubenest-backend
    # PINNED, NOT FLOATING. This chart used to ship tag "latest" with
    # pullPolicy: Always, which meant the control-plane binary was re-resolved
    # on EVERY POD START: a node reboot silently changed the control plane on
    # an installation nobody touched, and no field in the chart could say which
    # build was running. See kn-control-plane-chart-floats-latest-tkof.
    #
    # tag is what a human reads; digest is what Kubernetes resolves, and digest
    # WINS (templates/_helpers.tpl "kubenest.image"). THEY MOVE TOGETHER — a tag
    # that disagrees with its digest is a comment that lies. Both were verified
    # against ghcr on 2026-09-24: the build-image run for 132b7ea pushed
    # :132b7ea and :latest as the digest below.
    #
    # WHAT THIS BUILD IS: org.opencontainers.image.revision on this image is
    # the full sha of kubenest-backend 132b7ea. It carries the kn-cjqw
    # Option A cutover (efd4540: no control-plane Argo CD registration path,
    # no stored cluster bearer, no self-seeded host cluster, so the cluster
    # that hosts this chart registers through the API under D17), 176b972
    # (the Argo CD Application watcher that cutover left behind is deleted),
    # and 132b7ea, whose catalog serves bundle 1.1. A control plane that
    # cannot serve 1.1 cannot upgrade a cluster to it. An image older than
    # efd4540 would re-create the two-writer identity Secret collision.
    # 675ff0e (2026-09-25; 7f63a7d was the first) is an image this chart can run: it reads
    # AGENT_JWT_SECRET, carries the checkpoint runner and postgresql-client-18,
    # and does not migrate on start when MIGRATE_ON_START=false. An older image
    # needs the migrate initContainer this chart no longer has. c121ed8 carries
    # what an install with a backup target needs: the record routes accept the
    # installer's CLI token (640ede5), the configured admin is the instance
    # administrator who may record the control-plane kit (9e9698d), the
    # management cluster's backup group folds the checkpoint status of the
    # cluster the recorded control-plane kit names (73b8762), a security change
    # creates its checkpoint Job from the CronJob (c458014), and a status
    # ConfigMap with nothing published yet reads as "no checkpoint" (c121ed8).
    # 2a7dc07 adds the control plane's identity (contract era and build) to the
    # cluster record and the management cluster's backup group (kn-t70).
    # 279b285 runs the checkpoint as the dump and seal stages around this
    # chart's restore stage, so each checkpoint proves it restores before it
    # is sealed and no drill key is needed (kn-drill-identity-u6il).
    # 60ba66a serves bundle 1.2 (kn-t72), raises the revocation floor on a
    # re-mint (kn-t49...uzka.1), stores the hub's microsecond connection epoch
    # (kn-a3x0), beats the customer's heartbeat URL (kn-t28), records a
    # recovered cluster's incarnation (kn-t49) and mints the operator chart from
    # the requested bundle (kn-t72...0xx7.1).
    # 90480e2 lets a CLI token carrying clusters:rotate rotate an agent token
    # (kn-t48...prao.1).
    # 709b710 re-delivers a cluster's projects when a new incarnation is
    # recorded, so a rebuilt cluster receives its Project CRs and a recovery
    # can restore into them (kn-t49...uzka.4; S6 on lab s6, 2026-09-28). It
    # is 68232ee plus that one commit; 68232ee accepts the recovery stages
    # in the install journal (kn-t48...prao.2).
    # 59f4ec3 is 709b710 plus the bundle 1.2 catalog's move to operator
    # candidate 2.7.0-rc.2 (image c79248b), so a 1.2 mint hands out rc.2
    # (kn-t71...ea7h).
    tag: "59f4ec3"
    digest: "sha256:fe2aba5b5b529d8e9da3c7acaea59e5f2f64cd7bd63b44479906762ab1011812"
    # IfNotPresent, coherent with a digest. Always + a digest is merely
    # wasteful; Always + a mutable tag was the defect. This matches what the
    # provisioner does after kn-provisioner-untraceable-pin-m1b2.
    pullPolicy: IfNotPresent
  # -- HELD BACKEND IMAGE. Empty on every install and every ordinary upgrade, and
  # set only by `kubenest platform upgrade --control-plane` while its fence is up
  # (pkg/controlplane's FenceValues, and the failed-migration restore).
  #
  # It holds THIS DEPLOYMENT on the code the control plane ran before an upgrade,
  # so that the apply raising the fence cannot roll the new chart's image before
  # the migration, and so that a control plane whose migration failed serves the
  # code its schema matches.
  #
  # ONLY THIS DEPLOYMENT READS IT, which is the whole point: `backend.image` is
  # also the image the checkpoint CronJob and the migration Job run, and their
  # COMMANDS are this chart's, so holding them on an older image runs a command
  # that image does not have. On 2026-09-26 the checkpoint's `dump` container did
  # exactly that (`usage: python -m app.services.checkpoint_runner ...`) and the
  # upgrade died at the checkpoint stage
  # (kn-t70-control-plane-version-identity-4xso.5).
  #
  # A reference here is repository/tag/digest in the same shape as backend.image,
  # and templates/_helpers.tpl "kubenest.image" renders it the same way. The pull
  # policy is the held pin's own, or backend.image's when it names none.
  heldImage: {}
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # -- Initial admin user, created by the backend on first boot.
  admin:
    email: "admin@kubenest.io"
    # -- REQUIRED, no default. The installer generates a random password and
    # sets it here; the chart refuses to render while this is empty.
    password: ""
  # -- CRUD admin API (CRUD_ADMIN_ENABLED). Off by default: the UI is the
  # intended admin surface, and this API is for scripted cluster setup.
  crudAdmin:
    enabled: false
  # -- The cluster id THIS control plane runs in, as the installer registered
  # it. The newest eligible checkpoint and its restore drill are that
  # cluster's own recovery facts and are merged into its `backup` verdict
  # (kn-t47); empty means they are reported nowhere, which is the honest state
  # until the installer fills this in.
  managementClusterId: ""

# --- Hub (Go WebSocket relay) ---
hub:
  image:
    repository: ghcr.io/kubenesthq/kubenest-hub
    # Same defect, same fix. :094b95e and :latest resolved to this digest on
    # 2026-09-11. Its org.opencontainers.image.revision is
    # 094b95e3b3ab347a54fd54309eea5144653d5f89 — the hub only recently learned
    # to stamp that (kn-xl9u); before it did, a hub image could be pinned but
    # not identified.
    # 120baa5 (2026-09-25): the first hub that verifies agents with
    # AGENT_JWT_SECRET (it no longer reads JWT_SECRET, so an older hub crashes
    # under this chart) and understands the maintenance-window events.
    # 0e0d904 (2026-09-28): stamps the operator connection epoch the backend
    # stores (kn-a3x0) and accepts every install stage the contract names,
    # including the recovery stages (kn-t48...prao.2).
    tag: "0e0d904"
    digest: "sha256:6119340ef4563b9f17eab3f15728db288dbf252b5fbad88b5ec3abd51ca3deaf"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # -- Public base URL of the hub that the backend hands to clusters; the
  # backend appends /ws/operator. Empty means wss://hub.<domain>.
  publicURL: ""

# --- UI (Next.js) ---
ui:
  image:
    repository: ghcr.io/kubenesthq/kubenest-ui
    # Same defect, same fix. :5b72b22 and :latest resolved to this digest on
    # 2026-09-11.
    #
    # STATED LIMIT: this image carries NO org.opencontainers.image.revision, so
    # the digest pins it EXACTLY but nothing says which commit built it. A
    # digest without provenance is still strictly better than a mutable tag —
    # two installs of this chart now get the same bytes — but "which UI source
    # is this" remains unanswerable for this component. That is the kn-xl9u
    # shape, unfixed here; the UI build needs the same revision label the hub
    # just gained.
    tag: "5b72b22"
    digest: "sha256:2c0e0838dd0f8e8c43557c708f4cce27f927482334cf950d6795e912a3e11752"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# --- PostgreSQL (Bitnami) ---
postgresql:
  enabled: true
  auth:
    username: kubenest
    # -- REQUIRED. The installer generates a random password and sets it here.
    password: ""
    database: kubenest
  image:
    # -- The repository the digest below belongs to. Stated here because TWO
    # things must agree with this image's MAJOR: the checkpoint CronJob's
    # scratch Postgres (the drill restores into a server of THIS image), and
    # `postgresql-client-18` in kubenest-backend's Dockerfile, which is what
    # takes the dump. A client older than its server refuses to dump it, so the
    # Dockerfile's major is a fact about this value and not a separate choice.
    # No registry prefix: the Bitnami subchart prepends its own registry, and
    # "docker.io/bitnami/postgresql" rendered as an unpullable
    # registry-1.docker.io/docker.io/bitnami/postgresql (found on real hardware
    # 2026-09-25). Unqualified, the checkpoint templates resolve it on Docker Hub.
    repository: bitnami/postgresql
    # -- Pinned to the digest bitnami/postgresql:latest resolved to on
    # 2026-09-24, so the chart installs the same bytes offline.
    digest: "sha256:7d77a46bbf200709237318c27dec0eaeae2520e403dd18fdebde2be7a6b04993"
  primary:
    persistence:
      size: 5Gi

# --- Redis (Bitnami) ---
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  image:
    # -- Pinned to the digest bitnami/redis:latest resolved to on 2026-09-24.
    digest: "sha256:ef8442c1ec2e28cef662999f348a4369c22343dc0c86c3bc23041fad22f13ca1"
  master:
    persistence:
      size: 1Gi

# --- The maintenance fence (T7.0) ---
# During a control-plane upgrade the public API route must not reach the
# backend: the backend Deployment uses the Recreate strategy, its schema is
# being migrated by a Job the CLI runs as a recorded step, and two versions of
# the code must never serve at once. The CLI raises this fence and sets these
# values; nothing sets them by hand.
#
# WHY A VALUE AND NOT A CLI PATCH OF THE ROUTE. helm-controller applies this
# chart server-side with --force-conflicts=false, so a chart-rendered field
# owned by a second writer makes the next chart apply fail — observed on
# hardware on 2026-09-25 as `conflict with "kubectl-patch"`. Rendering the
# fenced backendRef keeps it under helm, including during the chart apply that
# runs inside the same upgrade.
#
# The fence's own objects (a ConfigMap carrying the maintenance message, a
# Deployment answering 503 on every path and the Service this route points at)
# are NOT rendered here: the CLI writes them into k3s's auto-deploy directory,
# so they carry no chart version, need no backend code and survive a restart.
fence:
  # -- Point the api.<domain> route at the fence Service instead of the backend.
  enabled: false
  # -- Name of the fence Service. Empty means <release>-fence, which is what
  # the CLI creates.
  service: ""
  # -- Port of the fence Service.
  port: 8080

# --- Migrations (kn-t47) ---
# The migration used to run as a pod initContainer. It is now a Job a caller
# asks for, because a migration that runs as a side effect of a pod start
# cannot be observed, resumed or ordered before a restore.
migration:
  # -- Render the migration Job. OFF BY DEFAULT: a fresh install does not
  # migrate an empty database, and a recovery install runs it only when the
  # chart is newer than the checkpoint it restored (T4.8).
  enabled: false

# --- Control-plane recovery checkpoints (kn-t47) ---
# The control plane's Postgres holds every organisation, member, role, window,
# alert route, inventory and token floor in the installation. This CronJob is
# the ONLY supported recovery path for it: `pg_dump -Fc`, encrypted to the
# fleet recipient, uploaded with its recovery-set manifest. The bundled
# Postgres chart's same-host `pg_dumpall` and the live data directory are not
# recovery paths (a lost host takes them with it).
checkpoint:
  # -- Render the checkpoint CronJob.
  enabled: true
  # -- Nightly, in the CHART's cron syntax. The job name is stable, because the
  # backend derives a security-triggered Job from this object (kn-t47).
  schedule: "17 2 * * *"
  # -- How long a nightly checkpoint's objects are kept. THE FLOOR IS 14 DAYS:
  # a shorter retention cannot be handed to a customer as a recovery history.
  retentionHours: 336
  # -- How long a SECURITY-TRIGGERED checkpoint is kept (the backend stamps
  # this onto the Job it derives). Short on purpose: a busy afternoon of
  # revocations must not evict the nightly history.
  securityRetentionHours: 6
  # -- REQUIRED. The fleet recipient's `age` PUBLIC key (age1...). The private
  # key never touches a host; recovery happens where the kit is opened.
  recipient: ""
  # -- S3 prefix the checkpoints are written under. The control-plane bucket
  # and its credentials are separate from every cluster's own backup principal
  # (the control plane's checkpoints and a cluster's backups must not share a
  # credential).
  bucket: ""
  prefix: "control-plane/"
  # -- Secret holding the object-store credentials. Keys: AWS_ACCESS_KEY_ID,
  # AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION, and AWS_ENDPOINT_URL for an
  # S3-compatible store. Created outside the chart, like the backup credentials
  # `kubenest backup set-target` manages.
  credentialsSecret: "kubenest-cp-checkpoint-credentials"
  # -- Scratch space for the dump, its ciphertext and the scratch cluster the
  # restore stage loads it into. ONE claim, and 10Gi is what a control plane's
  # database plus its restored copy fits in: at 20Gi the claims did not fit
  # beside the rest of the control plane on a 50 GB data volume, and the pod
  # could never be scheduled (lab, 2026-09-25).
  scratch:
    size: 10Gi
    storageClassName: ""
  # THE IMAGE THE CHECKPOINT RUNS IN IS THE BACKEND'S, above, and there is no
  # separate tools image. That image is already pinned by digest, and it now
  # carries `pg_dump` and `age` (kubenest-backend's Dockerfile). The tools
  # image this used to name had no digest anywhere on the install path, so the
  # CronJob could not render and the control plane went unprotected — which is
  # the whole reason there is no longer a second place to pin an image.
  #
  # -- A single checkpoint's own resource ceiling. The dump is I/O bound.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
