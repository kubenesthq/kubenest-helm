apiVersion: v2
name: kubenest
description: KubeNest control plane — backend, hub, UI, PostgreSQL and Redis for one cluster
type: application
version: 3.0.0
appVersion: "3.0.0"

maintainers:
  - name: Kubenest Team
    email: support@kubenest.io

dependencies:
  - name: postgresql
    version: "18.5.13"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled

  - name: redis
    version: "25.3.8"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
