{{- if .Values.checkpoint.enabled }}
{{- $checkpoint := include "kubenest.image" .Values.backend.image }}
{{- $postgres := printf "%s@%s" .Values.postgresql.image.repository (required "postgresql.image.digest is required: the checkpoint's scratch Postgres is this image, and it has to be the same major as the client in the backend image that dumps through it" .Values.postgresql.image.digest) }}
{{- $scratch := printf "%s-checkpoint-scratch" .Release.Name }}
# THE CONTROL PLANE'S ONLY SUPPORTED RECOVERY PATH (kn-t47).
#
# WHAT IT IS FOR. The control plane's Postgres holds every organisation,
# member, role, window, alert route, inventory and token floor in this
# installation, and it was backed up nowhere: the bundled Postgres chart's
# `pg_dumpall` runs on the same host and is off by default, so losing the host
# lost the control plane permanently. This takes a LOGICAL checkpoint — the
# database, not a copy of the host — encrypts it to the fleet recipient, and
# uploads it with a manifest that says exactly what it is (control-plane
# version, Postgres major and image, the roles and extensions `pg_restore`
# needs, row counts, checksums, the management cluster's id).
#
# EVERY CHECKPOINT PROVES ITS OWN DUMP RESTORES, IN THE SAME POD, BEFORE IT IS
# SEALED AND UPLOADED (kn-drill-identity-u6il). The pod is three stages:
#
#   initContainer `dump`     the backend image dumps the database and writes the
#                            server's own facts (row counts, roles, extensions,
#                            major) into the scratch volume;
#   initContainer `restore`  the CHART'S Postgres image loads that dump into a
#                            scratch cluster on the same volume, writes the
#                            restored row counts beside it, and records its
#                            outcome;
#   container `seal`         the backend image compares the counts, and only on
#                            a match encrypts, uploads, reads the stored
#                            ciphertext back, publishes the drill as passed and
#                            the checkpoint as eligible. A dump that does not
#                            restore publishes a FAILED drill, uploads nothing
#                            and marks nothing eligible.
#
# WHY THIS REPLACED A SEPARATE WEEKLY DRILL JOB. That Job decrypted the newest
# checkpoint with an `age` identity Secret, and no install ever wrote that
# Secret (nothing in the CLI created it, and the fleet private key is printed
# once and stored nowhere by design — T4.6), so the drill could never run and
# the restore path was never exercised at all. Proving the PLAINTEXT restores
# needs no private key on any host, and doing it in the pod that takes the
# checkpoint means every nightly and every security-triggered checkpoint is
# drilled rather than one a week. What it no longer proves, stated plainly:
# that the FLEET private key opens the stored ciphertext. Opening a checkpoint
# with the fleet key is part of a real recovery (T4.8/T4.9) and of the hardware
# gate.
#
# ONE IMAGE FOR TWO THINGS, AND THE CHART'S POSTGRES FOR THE THIRD. The dump and
# the seal are the backend image's own entrypoint
# (`app/services/checkpoint_runner.py`), which is the image this chart already
# pins by digest: it carries `pg_dump` (postgresql-client, the same major as the
# Postgres above) and `age`, so there is no second image to build, publish, pin
# or keep in step — the previous tools image had no digest on install, which
# left this CronJob unrenderable and the control plane unprotected. The restore
# needs a SERVER (initdb, pg_ctl) and the backend image carries a client by
# design, so that one stage runs the pinned Postgres image.
#
# ELIGIBILITY IS THE LAST WRITE, NOT THE FIRST. The seal container uploads the
# ciphertext, reads its SHA-256 back from the bucket, uploads the manifest, and
# only then publishes the drill result and the eligibility marker — so a run
# that dies halfway leaves the previous eligible checkpoint as the newest one. A
# failed run can never leave an older file posing as a new one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-checkpoint
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-checkpoint
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
rules:
  # The status ConfigMap is the record of what is eligible and whether the
  # restore drill passed. Read to merge (the drill's result and the
  # checkpoint's own fields are written one after the other and neither may
  # erase the other), created when the namespace never had one, and PATCHED to
  # publish — the entrypoint sends a merge patch of one key
  # (app/services/checkpoint_runner.py::_write_status), so `patch` is what it
  # needs and `update` is deliberately absent.
  #
  # NO `secrets` VERB, deliberately. This ServiceAccount used to carry one, and
  # nothing on this path reads a Secret through the API server: the database
  # password and the object-store credentials are env secretKeyRefs, which the
  # kubelet reads under the pod's own identity, and this pod decrypts nothing —
  # the restore it runs is of its OWN dump, before the seal. A grant this
  # account does not use is a way to read a credential from a Job that only
  # ever needs to write one ConfigMap.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-checkpoint
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-checkpoint
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-checkpoint
    namespace: {{ .Release.Namespace }}
---
# THE OBJECT, AND NO DOCUMENT IN IT. Created at install so the backend can tell
# "no eligible checkpoint yet" from "the CronJob was deleted": an absent
# ConfigMap reads as unknown, this one reads as unprotected-with-no-checkpoint.
# What gets published is the CronJob's business, not the chart's — the runner
# merge-patches `data.status` (app/services/checkpoint_runner.py::_write_status)
# and creates the object itself when it is missing — so `data` must NOT be
# rendered here. It used to carry a placeholder document, and a server-side
# apply (helm-controller's `--server-side=auto --force-conflicts=false`) then
# collided with the runner's field manager on every upgrade after the first
# checkpoint: `Apply failed with 1 conflict: conflict with "kubectl-patch" using
# v1: .data.status` (hardware, 2026-09-25). A field a runtime writer owns is not
# the chart's to write, and nothing was lost with the placeholder: the backend
# takes the management cluster's id from the recorded control-plane kit
# (app/services/management_cluster.py), and readers see "no document yet" as the
# same thing the placeholder said.
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-plane-checkpoint-status
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-checkpoint-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
data:
  # THE RESTORE STAGE, and the only stage that is not the backend image's
  # entrypoint: loading the dump into a scratch Postgres in this pod needs the
  # server's own binaries.
  restore.sh: |
    #!/bin/sh
    set -uo pipefail
    scratch=/scratch
    export PGDATA="$scratch/pgdata"
    # THE OUTCOME IS A FILE, NOT THIS SCRIPT'S EXIT STATUS. The seal container
    # is what publishes a result, and an initContainer that exits non-zero
    # stops the pod before it runs — so a restore that failed would leave the
    # drill ABSENT rather than FAILED, which is exactly what an operator cannot
    # act on ("did the Job run?"). Every failure below is recorded and the
    # script then exits 0 so the seal stage can publish it; a failure that
    # cannot even be recorded is published as failed too, because the seal
    # stage treats a missing report as a failure.
    result="$scratch/restore_result.txt"
    report_failure() {
      printf 'failed: %s\n' "$1" > "$result" 2>/dev/null || true
    }
    # THE SCRATCH CLUSTER IS REMOVED ON EVERY PATH, success or failure: the
    # scratch volume is reused by the next checkpoint, and a data directory
    # left behind makes that run's initdb refuse to start.
    cleanup() {
      pg_ctl -D "$PGDATA" -m immediate stop >/dev/null 2>&1 || true
      rm -rf "$PGDATA"
    }
    trap cleanup EXIT

    initdb --auth=trust --username=postgres >/dev/null 2>&1 \
      || { report_failure "initdb could not create the scratch cluster"; exit 0; }
    pg_ctl -D "$PGDATA" -o "-c listen_addresses='' -c unix_socket_directories=$scratch" -w start >/dev/null 2>&1 \
      || { report_failure "the scratch cluster would not start"; exit 0; }
    createdb -h "$scratch" -U postgres restored \
      || { report_failure "createdb could not create the database the dump is restored into"; exit 0; }
    pg_restore -h "$scratch" -U postgres -d restored --no-owner --no-privileges "$scratch/control-plane.dump" \
      || { report_failure "pg_restore could not load the dump"; exit 0; }
    # THE SAME QUERY THE DUMP STAGE USED (app/services/checkpoint_runner.py,
    # ROW_COUNTS_SQL). Exact counts, not pg_stat_user_tables' n_live_tup
    # estimate: a restore that was refused because autovacuum had not run yet
    # would be a checkpoint nobody trusts, and one that PASSED on estimates
    # would not be comparing the rows.
    psql -h "$scratch" -U postgres -d restored -Atc \
      "SELECT relname || ' ' || (xpath('/row/c/text()', query_to_xml(format('SELECT count(*) AS c FROM %I.%I', schemaname, relname), false, true, '')))[1]::text FROM pg_stat_user_tables ORDER BY relname" \
      > "$scratch/restored_row_counts.txt" \
      || { report_failure "the restored row counts could not be read"; exit 0; }

    printf 'ok\n' > "$result"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-checkpoint
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
spec:
  schedule: {{ .Values.checkpoint.schedule | quote }}
  # One at a time: two concurrent dumps of the same database is load for no
  # benefit, and a missed run is retried by the next one.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # The Job object is kept for the checkpoint's own retention, so its logs
      # outlive the sweep that created it.
      ttlSecondsAfterFinished: {{ mul .Values.checkpoint.retentionHours 3600 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/component: checkpoint
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Release.Name }}-checkpoint
          securityContext:
            # The backend image runs as uid 1000 (app), and the scratch volume
            # is where the dump, its ciphertext and the manifest are written.
            # 1000 is also the GROUP the restore stage runs with, because the
            # kubelet gives every container in the pod this group on the volume
            # — see that container's own securityContext for its uid.
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 8 }}
          {{- end }}
          # THREE STAGES, IN THIS ORDER, because the proof has to come before
          # the upload: initContainers are ordered, and the seal container is
          # the only one that publishes anything.
          initContainers:
            - name: dump
              image: {{ $checkpoint | quote }}
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              # `command`, not `args`: it REPLACES the image's entrypoint
              # (scripts/entrypoint.sh), which migrates the database when
              # MIGRATE_ON_START is not "false" — a checkpoint pod must never
              # write to the schema it is dumping. MIGRATE_ON_START is set
              # anyway, below, for the same reason the migration Job sets it.
              command: ["python", "-m", "app.services.checkpoint_runner", "dump"]
              env:
                {{- include "kubenest.checkpoint.env" . | nindent 16 }}
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
            - name: restore
              image: {{ $postgres | quote }}
              imagePullPolicy: IfNotPresent
              # No environment: this stage loads the dump into a cluster of its
              # own over a unix socket in the scratch volume, so it needs
              # neither the control plane's database nor the object store, and
              # a stage that cannot reach a credential cannot leak one.
              command: ["/scripts/restore.sh"]
              securityContext:
                # uid 26 IS THIS IMAGE'S OWN `postgres` USER, and both numbers
                # matter. `command` replaces the image's entrypoint, so the
                # nss_wrapper that entrypoint sets up never runs — and without
                # it the image's declared USER (1001) has no /etc/passwd entry,
                # so `initdb` refuses with "could not look up effective user ID
                # 1001: user does not exist" (measured against the digest at
                # postgresql.image.digest, whose /etc/passwd holds
                # `postgres:x:26`). The GROUP is the pod's fsGroup, because the
                # kubelet makes the scratch volume 0770 root:fsGroup: a
                # container in another group cannot write the data directory
                # this stage has to create.
                runAsUser: 26
                runAsGroup: 1000
                runAsNonRoot: true
              volumeMounts:
                {{- include "kubenest.checkpoint.mounts" . | nindent 16 }}
          containers:
            - name: seal
              image: {{ $checkpoint | quote }}
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command: ["python", "-m", "app.services.checkpoint_runner", "seal"]
              env:
                {{- include "kubenest.checkpoint.env" . | nindent 16 }}
              resources:
                {{- toYaml .Values.checkpoint.resources | nindent 16 }}
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
          volumes:
            - name: scripts
              configMap:
                name: {{ .Release.Name }}-checkpoint-scripts
                defaultMode: 0555
            - name: scratch
              persistentVolumeClaim:
                claimName: {{ $scratch }}
---
# DEDICATED SCRATCH STORAGE. Not an emptyDir: the dump of a customer's whole
# control plane does not belong on the node's disk, where a full node evicts
# the pod mid-dump and leaves a partial file behind. It is also where the
# restore stage starts its scratch cluster, which is why one claim is enough
# for the whole pod and there is no second one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $scratch }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.checkpoint.scratch.size }}
  {{- with .Values.checkpoint.scratch.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
