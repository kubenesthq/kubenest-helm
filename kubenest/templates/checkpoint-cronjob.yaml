{{- if .Values.checkpoint.enabled }}
{{- $checkpoint := include "kubenest.image" .Values.backend.image }}
{{- $postgres := printf "%s@%s" .Values.postgresql.image.repository (required "postgresql.image.digest is required: the checkpoint's scratch Postgres is this image, and it has to be the same major as the client in the backend image that dumps through it" .Values.postgresql.image.digest) }}
{{- $scratch := printf "%s-checkpoint-scratch" .Release.Name }}
{{- $drillScratch := printf "%s-checkpoint-drill-scratch" .Release.Name }}
# THE CONTROL PLANE'S ONLY SUPPORTED RECOVERY PATH (kn-t47).
#
# WHAT IT IS FOR. The control plane's Postgres holds every organisation,
# member, role, window, alert route, inventory and token floor in this
# installation, and it was backed up nowhere: the bundled Postgres chart's
# `pg_dumpall` runs on the same host and is off by default, so losing the host
# lost the control plane permanently. This takes a LOGICAL checkpoint — the
# database, not a copy of the host — encrypts it to the fleet recipient, and
# uploads it with a manifest that says exactly what it is (control-plane
# version, Postgres major and image, the roles and extensions `pg_restore`
# needs, row counts, checksums, the management cluster's id).
#
# ONE IMAGE, THE BACKEND'S. The checkpoint is taken by the backend image's own
# entrypoint (`app/services/checkpoint_runner.py`), which is the image the chart
# already pins by digest. It carries `pg_dump` (postgresql-client, the same
# major as the Postgres above) and `age`, so there is no second image to build,
# publish, pin or keep in step — the previous tools image had no digest on
# install, which left this CronJob unrenderable and the control plane
# unprotected.
#
# ELIGIBILITY IS THE LAST WRITE, NOT THE FIRST. The entrypoint uploads the
# ciphertext, reads it back by size, uploads the manifest, reads it back, and
# only then publishes the status ConfigMap — so a run that dies halfway leaves
# the previous eligible checkpoint as the newest one. A failed run can never
# leave an older file posing as a new one.
#
# THE POSTGRES IMAGE SURVIVES FOR ONE STAGE: the WEEKLY DRILL's restore. It
# starts a scratch Postgres inside the pod (initdb/pg_ctl) and loads the
# checkpoint into it, which needs a server, and the backend image carries a
# client by design. Nothing else uses it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-checkpoint
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-checkpoint
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
rules:
  # The status ConfigMap is the record of what is eligible and whether the
  # restore drill passed. Read to merge (the drill must not erase the
  # checkpoint's own fields), created when the namespace never had one, and
  # PATCHED to publish — the entrypoint sends a merge patch of one key
  # (app/services/checkpoint_runner.py::_write_status), so `patch` is what it
  # needs and `update` is deliberately absent.
  #
  # NO `secrets` VERB, deliberately. This ServiceAccount used to carry one, and
  # nothing on either path reads a Secret through the API server: the database
  # password is an env secretKeyRef and the drill's identity is a mounted
  # Secret, both of which the kubelet reads under the pod's own identity. A
  # grant this account does not use is a way to read the fleet key from a Job
  # that only ever needs to write one ConfigMap.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-checkpoint
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-checkpoint
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-checkpoint
    namespace: {{ .Release.Namespace }}
---
# The status document, created at install so the backend can tell "no eligible
# checkpoint yet" from "the CronJob was deleted": an absent ConfigMap reads as
# unknown, and this one reads as unprotected-with-an-age. The CronJob merges
# into it; nothing else writes it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-plane-checkpoint-status
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
data:
  status: |
    {
      "management_cluster_id": {{ .Values.backend.managementClusterId | quote }},
      "latest_eligible": null,
      "drill": {"status": "never_run"}
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-checkpoint-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
data:
  # THE DRILL'S ONLY SCRIPT, and the only stage that is not the backend image's
  # entrypoint: the drill loads the checkpoint into a scratch Postgres inside
  # the pod, and starting a server needs the server's own binaries.
  restore.sh: |
    set -euo pipefail
    scratch=/scratch
    export PGDATA="$scratch/pgdata"
    # A SCRATCH CLUSTER INSIDE THE POD: the drill must not touch the running
    # control plane's database, and it must not need a second Postgres.
    initdb --auth=trust --username=postgres >/dev/null
    pg_ctl -D "$PGDATA" -o "-c listen_addresses='' -c unix_socket_directories=$scratch" -w start
    trap 'pg_ctl -D "$PGDATA" -m immediate stop >/dev/null 2>&1 || true' EXIT
    createdb -h "$scratch" -U postgres restored
    pg_restore -h "$scratch" -U postgres -d restored --no-owner --no-privileges "$scratch/control-plane.dump"
    # THE SAME QUERY THE MANIFEST USED (app/services/checkpoint_runner.py,
    # ROW_COUNTS_SQL). Exact counts, not pg_stat_user_tables' n_live_tup
    # estimate: a drill that failed because autovacuum had not run yet would be
    # a drill nobody trusts, and a drill that PASSED on estimates would not be
    # comparing the rows.
    psql -h "$scratch" -U postgres -d restored -Atc \
      "SELECT relname || ' ' || (xpath('/row/c/text()', query_to_xml(format('SELECT count(*) AS c FROM %I.%I', schemaname, relname), false, true, '')))[1]::text FROM pg_stat_user_tables ORDER BY relname" \
      > "$scratch/restored_row_counts.txt"
    pg_ctl -D "$PGDATA" -m fast -w stop
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-checkpoint
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
spec:
  schedule: {{ .Values.checkpoint.schedule | quote }}
  # One at a time: two concurrent dumps of the same database is load for no
  # benefit, and a missed run is retried by the next one.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # The Job object is kept for the checkpoint's own retention, so its logs
      # outlive the sweep that created it.
      ttlSecondsAfterFinished: {{ mul .Values.checkpoint.retentionHours 3600 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/component: checkpoint
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Release.Name }}-checkpoint
          securityContext:
            # The backend image runs as uid 1000 (app), and the scratch volume
            # is where the dump, its ciphertext and the manifest are written.
            # 1000 is the backend image's own group, so the same value works
            # for every container in both pods.
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 8 }}
          {{- end }}
          # ONE CONTAINER, ONE PROCESS, ONE ORDER. Dump, seal, upload and the
          # eligibility write used to be four containers handing files to each
          # other through the scratch volume, with busy-wait loops between them.
          # They are one entrypoint now, so "the status is published last" is a
          # property of a program rather than of a pod's container ordering.
          containers:
            - name: checkpoint
              image: {{ $checkpoint | quote }}
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              # `command`, not `args`: it REPLACES the image's entrypoint
              # (scripts/entrypoint.sh), which migrates the database when
              # MIGRATE_ON_START is not "false" — a checkpoint pod must never
              # write to the schema it is dumping. MIGRATE_ON_START is set
              # anyway, below, for the same reason the migration Job sets it.
              command: ["python", "-m", "app.services.checkpoint_runner", "run"]
              env:
                {{- include "kubenest.checkpoint.env" . | nindent 16 }}
              resources:
                {{- toYaml .Values.checkpoint.resources | nindent 16 }}
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
          volumes:
            - name: scratch
              persistentVolumeClaim:
                claimName: {{ $scratch }}
---
# DEDICATED SCRATCH STORAGE. Not an emptyDir: the dump of a customer's whole
# control plane does not belong on the node's disk, where a full node evicts
# the pod mid-dump and leaves a partial file behind.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $scratch }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.checkpoint.scratch.size }}
  {{- with .Values.checkpoint.scratch.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
# The drill gets its OWN scratch volume: both CronJobs are ReadWriteOnce and
# the drill's `initdb` would otherwise wipe a dump that is still being taken.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $drillScratch }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.checkpoint.scratch.size }}
  {{- with .Values.checkpoint.scratch.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-checkpoint-drill
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
spec:
  schedule: {{ .Values.checkpoint.drillSchedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: {{ mul .Values.checkpoint.retentionHours 3600 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/component: checkpoint
            app.kubernetes.io/instance: {{ .Release.Name }}
            kubenest.io/purpose: restore-drill
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Release.Name }}-checkpoint
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 8 }}
          {{- end }}
          # THREE STAGES, IN ORDER, because initContainers are ordered and the
          # single app container is the one that records the result: fetch and
          # open the newest eligible checkpoint, load it into a scratch
          # Postgres, then compare what was restored with what the manifest
          # declared.
          initContainers:
            - name: fetch
              image: {{ $checkpoint | quote }}
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command: ["python", "-m", "app.services.checkpoint_runner", "drill-fetch"]
              env:
                {{- include "kubenest.checkpoint.env" . | nindent 16 }}
                # The drill's DECRYPTION key, held by the control plane's own
                # Secret and by nobody else on the host. A drill that cannot
                # decrypt is a drill that proves nothing.
                - name: CHECKPOINT_IDENTITY
                  value: /checkpoint-identity/identity.txt
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
                - name: identity
                  mountPath: /checkpoint-identity
                  readOnly: true
            - name: restore
              image: {{ $postgres | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/scripts/restore.sh"]
              env:
                {{- include "kubenest.checkpoint.env" . | nindent 16 }}
              volumeMounts:
                {{- include "kubenest.checkpoint.mounts" . | nindent 16 }}
          containers:
            - name: verify
              image: {{ $checkpoint | quote }}
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command: ["python", "-m", "app.services.checkpoint_runner", "drill-verify"]
              env:
                {{- include "kubenest.checkpoint.env" . | nindent 16 }}
              resources:
                {{- toYaml .Values.checkpoint.resources | nindent 16 }}
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
          volumes:
            - name: scripts
              configMap:
                name: {{ .Release.Name }}-checkpoint-scripts
                defaultMode: 0555
            - name: scratch
              persistentVolumeClaim:
                claimName: {{ $drillScratch }}
            - name: identity
              secret:
                secretName: {{ .Values.checkpoint.identitySecret }}
                optional: false
{{- end }}
