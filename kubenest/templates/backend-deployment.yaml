apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.installRevision }}
      annotations:
        kubenest.io/install-revision: {{ . | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-backend
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          image: "{{ include "kubenest.image" .Values.backend.image }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: POSTGRES_SERVER
              value: {{ include "kubenest.postgresql.host" . | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_PORT
              value: "5432"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: jwt-secret
            # The migration chain encrypts at rest (20260910_encrypt_cluster_bearer),
            # and the backend refuses to derive that key from SECRET_KEY, so a
            # fresh database cannot migrate without this.
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: encryption-key
      containers:
        - name: backend
          image: "{{ include "kubenest.image" .Values.backend.image }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_SERVER
              value: {{ include "kubenest.postgresql.host" . | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_PORT
              value: "5432"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: jwt-secret
            - name: HUB_URL
              value: "ws://{{ .Release.Name }}-hub:8001"
            # Base URL handed to clusters; the backend appends /ws/operator.
            # Defaults to the hub hostname the Gateway publishes.
            - name: HUB_PUBLIC_URL
              value: {{ .Values.hub.publicURL | default (printf "wss://hub.%s" .Values.domain) | quote }}
            - name: HUB_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: jwt-secret
            - name: REDIS_CACHE_HOST
              value: {{ include "kubenest.redis.host" . | quote }}
            - name: REDIS_QUEUE_HOST
              value: {{ include "kubenest.redis.host" . | quote }}
            - name: ENVIRONMENT
              value: "staging"
            - name: ADMIN_EMAIL
              value: {{ .Values.backend.admin.email | quote }}
            - name: ADMIN_PASSWORD
              value: {{ required "backend.admin.password is required" .Values.backend.admin.password | quote }}
            - name: CRUD_ADMIN_ENABLED
              value: {{ .Values.backend.crudAdmin.enabled | quote }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: encryption-key
            {{- if .Values.provisioningCallbackSecret }}
            - name: PROVISIONING_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: provisioning-callback-secret
            {{- end }}
            - name: KUBENEST_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
