apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  # RECREATE, NOT ROLLING (kn-t47). The backend refuses to start on a schema
  # its code does not match, and the schema is migrated by a Job the CLI
  # records as an operation step — so two versions must never be serving at the
  # same time, and a rolling update is exactly the window in which an old pod
  # and a migrated database coexist.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.installRevision }}
      annotations:
        kubenest.io/install-revision: {{ . | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-backend
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # NO migrate initContainer (kn-t47). "alembic upgrade head" as a side
      # effect of a pod start made an upgrade unobservable and unresumable, and
      # it ran on every restart of a Deployment whose code had not changed.
      # The migration is a Job the CLI creates once, as a recorded step of the
      # operation; the backend then refuses to start until the database's
      # revision matches the code's.
      containers:
        - name: backend
          image: "{{ include "kubenest.image" .Values.backend.image }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_SERVER
              value: {{ include "kubenest.postgresql.host" . | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_PORT
              value: "5432"
            # THE BACKEND DOES NOT MIGRATE ITSELF (kn-t47). The image's
            # entrypoint runs `alembic upgrade head` when this is not "false",
            # and with it on, every pod start migrated the database: the
            # previous release's code could be serving a schema a newer
            # migration had already changed, a fresh install migrated an empty
            # database before a checkpoint could be restored into it, and a
            # migration could be neither observed nor resumed.
            #
            # Off, the migration is the Job (templates/migration-job.yaml) the
            # CLI runs as a recorded step of the operation, the backend refuses
            # to start on a schema its code does not match
            # (app/core/schema.py), and the pod a migration fails in is a Job
            # pod whose log says why rather than a backend that restarted.
            - name: MIGRATE_ON_START
              value: "false"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: jwt-secret
            - name: HUB_URL
              value: "ws://{{ .Release.Name }}-hub:8001"
            # Base URL handed to clusters; the backend appends /ws/operator.
            # Defaults to the hub hostname the Gateway publishes.
            - name: HUB_PUBLIC_URL
              value: {{ .Values.hub.publicURL | default (printf "wss://hub.%s" .Values.domain) | quote }}
            - name: HUB_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: jwt-secret
            # The key agent tokens and the backend's own hub token are signed
            # with (kn-t47). Not jwt-secret: the hub verifies with THIS, and
            # SECRET_KEY must never leave this process.
            - name: AGENT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: agent-jwt-secret
            - name: REDIS_CACHE_HOST
              value: {{ include "kubenest.redis.host" . | quote }}
            - name: REDIS_QUEUE_HOST
              value: {{ include "kubenest.redis.host" . | quote }}
            - name: ENVIRONMENT
              value: "staging"
            - name: ADMIN_EMAIL
              value: {{ .Values.backend.admin.email | quote }}
            - name: ADMIN_PASSWORD
              value: {{ required "backend.admin.password is required" .Values.backend.admin.password | quote }}
            - name: CRUD_ADMIN_ENABLED
              value: {{ .Values.backend.crudAdmin.enabled | quote }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: encryption-key
            {{- if .Values.provisioningCallbackSecret }}
            - name: PROVISIONING_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: provisioning-callback-secret
            {{- end }}
            - name: KUBENEST_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Which cluster this control plane runs in, so the checkpoint and
            # the restore drill are reported in THAT cluster's `backup` group
            # (kn-t47). Empty means they are reported nowhere.
            - name: KUBENEST_MANAGEMENT_CLUSTER_ID
              value: {{ .Values.backend.managementClusterId | quote }}
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
