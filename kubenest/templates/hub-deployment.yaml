apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hub
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: {{ .Values.hub.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: hub
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: hub
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.installRevision }}
      annotations:
        kubenest.io/install-revision: {{ . | quote }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hub
          image: "{{ include "kubenest.image" .Values.hub.image }}"
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          ports:
            - name: ws
              containerPort: 8001
          env:
            # The hub holds ONE key, and it is the agent key: it verifies the
            # operator/agent tokens and the backend's own client_type: backend
            # token with it. It must not be given jwt-secret, which signs user
            # sessions inside the backend and never leaves it (kn-t47).
            - name: AGENT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: agent-jwt-secret
            - name: REDIS_URL
              value: "redis://{{ include "kubenest.redis.host" . }}:6379/0"
            - name: WS_PING_INTERVAL
              value: "30s"
            - name: WS_PONG_TIMEOUT
              value: "60s"
            # kn-nahc: refuse a credential presented as a URL query parameter. The
            # hub's Go default stays true for deployments still inside the migration
            # window; the control plane, whose operator and backend are header-only,
            # is where the fallback is turned off.
            - name: WS_ALLOW_QUERY_CREDENTIAL
              value: "false"
          readinessProbe:
            httpGet:
              path: /ready
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: ws
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
