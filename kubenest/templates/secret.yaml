apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "kubenest.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "jwtSecret is required" .Values.jwtSecret | quote }}
  # The hub's key and the backend's agent-signing key, separate from
  # jwt-secret: the hub is rebuildable from the control-plane kit, which
  # carries only this one (kn-t47).
  agent-jwt-secret: {{ required "agentJwtSecret is required" .Values.agentJwtSecret | quote }}
  database-url: {{ include "kubenest.database.url" . | quote }}
  admin-email: {{ .Values.backend.admin.email | quote }}
  admin-password: {{ required "backend.admin.password is required" .Values.backend.admin.password | quote }}
  encryption-key: {{ required "encryptionKey is required" .Values.encryptionKey | quote }}
  {{- if .Values.provisioningCallbackSecret }}
  provisioning-callback-secret: {{ .Values.provisioningCallbackSecret | quote }}
  {{- end }}
